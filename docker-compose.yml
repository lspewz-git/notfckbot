services:
  db:
    image: mariadb:11.4
    container_name: series_bot_db
    restart: always
    environment:
      MARIADB_ROOT_PASSWORD: ${MARIADB_ROOT_PASSWORD:-root_password}
      MARIADB_DATABASE: ${DB_NAME:-series_bot}
      MARIADB_USER: ${DB_USER:-bot_user}
      MARIADB_PASSWORD: ${DB_PASSWORD:-bot_password}
      # Runs mariadb-upgrade after a version bump (system tables are backed up first).
      MARIADB_AUTO_UPGRADE: "1"
    ports:
      - "3306:3306"
    volumes:
      - mariadb_data:/var/lib/mysql
    healthcheck:
      test: [ "CMD", "healthcheck.sh", "--connect", "--innodb_initialized" ]
      interval: 10s
      timeout: 5s
      retries: 5

  app:
    build: .
    container_name: series_bot_app
    restart: always
    depends_on:
      db:
        condition: service_healthy
    # The process runs as root inside (the project folder is root's on the host), but without root's
    # kernel privileges: it reads and writes its own files, listens on 3000/3001, and nothing more
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    environment:
      NODE_ENV: production
      BOT_TOKEN: ${BOT_TOKEN}
      DB_HOST: db
      IS_DOCKER: "true"
      DB_NAME: ${DB_NAME:-series_bot}
      DB_USER: ${DB_USER:-bot_user}
      DB_PASSWORD: ${DB_PASSWORD:-bot_password}
      TMDB_API_KEY: ${TMDB_API_KEY}
      TMDB_PROXY_URL: ${TMDB_PROXY_URL}
      KINOPOISK_API_KEY: ${KINOPOISK_API_KEY}
    ports:
      - "80:3001"
      - "443:3000"
    volumes:
      - .:/app
      - /app/node_modules

volumes:
  mariadb_data:
